<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategy Simulator</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Strategy Simulator</div>
    <nav class="strategy-tabs" id="strategy-tabs"></nav>
    <div class="horizon">
      <input id="start" type="date" value="2005-01-01" />
      <span>→</span>
      <input id="end" type="date" value="2024-12-31" />
    </div>
  </header>

  <main class="layout">
    <section class="col-code">
      <div class="panel">
        <header class="panel-head">
          <h3>Effective call</h3>
          <span class="panel-sub">updates as you drag</span>
        </header>
        <pre class="code-block live"><code id="code-live" class="language-python"></code></pre>
      </div>

      <div class="panel">
        <header class="panel-head">
          <div class="panel-tabs" id="code-tabs">
            <button class="active" data-view="signal">Signal</button>
            <button data-view="orders">build_target_weights</button>
            <button data-view="loop">run_weight_backtest</button>
          </div>
          <div class="panel-path" id="panel-path"></div>
        </header>
        <pre class="code-block"><code id="code-view" class="language-python"></code></pre>
      </div>

      <div class="panel">
        <header class="panel-head">
          <h3 id="strategy-title">Parameters</h3>
          <span class="panel-sub" id="strategy-summary"></span>
        </header>
        <div class="params" id="strategy-params"></div>
        <header class="panel-head">
          <h3>Engine</h3>
        </header>
        <div class="params" id="engine-params"></div>
      </div>
    </section>

    <section class="col-results">
      <div class="metrics-strip">
        <div class="m-card"><div class="m-label">Sharpe</div><div class="m-value" id="m-sharpe">—</div><div class="m-sub" id="m-sharpe-sub"></div></div>
        <div class="m-card"><div class="m-label">Ann. return</div><div class="m-value" id="m-return">—</div><div class="m-sub" id="m-return-sub"></div></div>
        <div class="m-card"><div class="m-label">Max drawdown</div><div class="m-value" id="m-dd">—</div><div class="m-sub" id="m-dd-sub"></div></div>
        <div class="m-card"><div class="m-label">T-cost drag / yr</div><div class="m-value" id="m-tcost">—</div><div class="m-sub" id="m-tcost-sub"></div></div>
      </div>

      <div class="panel">
        <header class="panel-head">
          <h3>Equity curve</h3>
          <span class="panel-sub" id="equity-sub">net of t-cost · vs equal-weight universe</span>
        </header>
        <div id="chart-equity" class="chart"></div>
      </div>

      <div class="stats-line" id="stats-line"></div>
    </section>
  </main>

  <div id="status-bar" class="statusbar">loading…</div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
